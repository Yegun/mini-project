[project]
name = "task-flow-backend"
version = "0.1.0"
description = "task-flow API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "fastapi",
    "psycopg[binary]>=3.3.6",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
