# Alembic settings. Keep this file ASCII only (Alembic reads it with the OS default encoding).
# The DB address is not written here: alembic/env.py reads DATABASE_ADMIN_URL from .env.
# Usage (run in the backend folder): alembic upgrade head / alembic downgrade -1 / alembic history / alembic current
[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
path_separator = os
